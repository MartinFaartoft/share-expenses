# Event model for the shared expenses app - the source of truth.
#
# Render and validate with:
#     .venv/bin/python docs/event-model/generate.py
#
# happy-path.d2 is generated from this file; never edit it by hand.
# Given-when-then specifications live in slice-NN-*.md.
#
# STRUCTURE
#   Every slice owns the elements it introduces.  An element is DECLARED once,
#   in mapping form with a `name`, at its first appearance in slice order; every
#   later appearance is a bare string reference.  So fields are written exactly
#   once, and a misspelled reference is an undeclared name rather than a silent
#   new element.
#
# ARROWS - none are written.
#   Intra-slice arrows are implied by `pattern`:
#     command : screen -> command -> each event, in listed order
#     view    : each event in `reads` -> read model -> screen
#   Inter-slice arrows exist only where a read model consumes events emitted in
#   other slices, declared as its `reads` list of event type names.  The
#   generator resolves each name to the nearest occurrence at or before this
#   slice, and draws it dashed when the only occurrence is later.

meta:
  diagram: happy-path
  # Field lines are padded to this many columns.  Equal-length lines in a
  # monospace font form a rectangle, and centring a rectangle leaves every line
  # flush left - this padding is what left-aligns the field lists.
  columns: 21
  card: { width: 250, height: 160 }

slices:

  - slice: Create group
    pattern: command
    screen:
      name: New group
      wireframe:
        - "name      [........]"
        - "currency  [ GBP  v ]"
        - ""
        - "  [ Create group ]"
    command:
      name: CreateGroup
      fields:
        name: string
        currency: string
        createdBy: Guid
    events:
      # three events from one command: a group whose creator is not a member is
      # a meaningless state, so the creator is seated and claimed here
      - name: GroupCreated
        fields:
          groupId: Guid
          name: string
          currency: string
          createdBy: Guid
      - name: MemberAdded
        fields:
          memberId: Guid
          displayName: string
      - name: MemberClaimed
        fields:
          memberId: Guid
          userId: Guid

  - slice: Add a member
    pattern: command
    screen:
      name: Group setup
    command:
      name: AddMember
    events: [MemberAdded]

  - slice: Invite a member
    pattern: command
    screen: Group setup
    command:
      name: InviteMember
    events:
      - name: MemberInvited
        fields:
          memberId: Guid
          email: string

  - slice: Claim a slot
    pattern: command
    screen:
      name: Sign in / claim
    command:
      name: ClaimMember
    events: [MemberClaimed]

  - slice: Record an expense
    pattern: command
    screen:
      name: Add expense
    command:
      name: RecordExpense
    events:
      - name: ExpenseRecorded

  - slice: View balances
    pattern: view
    screen:
      name: Balances
    readModel:
      name: GroupLedger
      fields:
        members: "Member[]"
        expenses: "Expense[]"
        balances: long
      reads:
        - GroupCreated
        - MemberAdded
        - MemberInvited
        - MemberClaimed
        - ExpenseRecorded
        - SettlementRecorded   # emitted in slice 7: drawn dashed

  - slice: Settle up
    pattern: command
    screen:
      name: Settle up
    command:
      name: RecordSettlement
    events:
      - name: SettlementRecorded
