# Event model for the SplitIt app - the source of truth.
#
# Render and validate with:
#     .venv/bin/python docs/event-model/generate.py
#
# The .d2 file is generated from this file, named after the chapter; never edit it
# by hand.  Card dimensions and the field-padding width are the generator's
# concern, not the model's: the padding width is computed from the longest line
# in the model.
# Given-when-then specifications live in slice-NN-*.md.
#
# STRUCTURE
#   Every slice owns the elements it introduces.  An element is DECLARED once,
#   in mapping form with a `name`, at its first appearance in slice order; every
#   later appearance is a bare string reference.  So fields are written exactly
#   once, and a misspelled reference is an undeclared name rather than a silent
#   new element.
#
# SLICE TYPES - the four canonical Event Modeling types:
#   State Change  a user action that changes system state, enforcing the business
#                 rules, and recording what happened as events
#   State Read    a screen, report or API response projected from stored events
#   Automation    reacts to a state without human intervention, issuing further
#                 commands or side effects
#   Translation   an integration point where the outside world pushes data in,
#                 mapping foreign data into this domain's language
#   Automation and Translation are recognised but not yet rendered: the happy path
#   needs neither, and their layout is best designed against a real slice.
#
# ARROWS - none are written.
#   Intra-slice arrows are implied by `type`:
#     State Change : screen -> command -> each event, in listed order
#     State Read   : each event in `reads` -> read model -> screen
#   Inter-slice arrows exist only where a read model consumes events emitted in
#   other slices, declared as its `reads` list of event type names.  The
#   generator resolves each name to the nearest occurrence at or before this
#   slice, and draws it dashed when the only occurrence is later.
#
# FIELDS - shape, and where every value comes from (information completeness).
#   A field is `name: Type`, or a mapping when it needs more than a type.
#   Shapes are declared once, like every element.  Sources sit on the field:
#     screen      a type only: what the screen holds, shows or takes in - typed,
#                 picked, or already there (the group viewed, the slot tapped).
#                 No source: values come from the read model, or go to a command
#     command     `source:` by trust -
#                   client  sent by the caller: typed, or held by the screen (default)
#                   system  supplied by the server: signed-in user, clock, new ids
#                   stream  derived by deciding, from the folded stream
#                   lookup  read from outside the stream, e.g. Identity; stale-able,
#                           so it never feeds an event field: it may feed guards, or
#                           propose candidates that deciding confirms against the stream
#                 `feeds:`  [Event.field, ...] - event fields it fills that are
#                           NOT already same-named (same name feeds implicitly)
#     event       a type only.  Where an event's values come from depends on the
#                 slice emitting it, so that lives on that slice's command.
#     read model  `source:` [Event, ...] - the events the field is built from; or
#                 system / lookup - supplied by the server to the read: the
#                 signed-in user, the clock, a document looked up
#   The generator checks BACKWARD only - every value used is available from a
#   step before it: every event field is fed by exactly one command field of the
#   same type; every client command field is a field of its screen; every field of
#   a screen declared by a State Read slice is a field of its read model; every
#   read model field is built from events the read model reads.  Whether a value
#   is used afterwards is not checked.
#   How a client value travels (route, body) is transport, not
#   model: it is recorded in the slice's .md and enforced in code.
#   `draft: true` marks a slice not yet refined: it skips these checks and is
#   labelled "(draft)" on the diagram.  Remove the flag as part of refining.

chapter: Happy path

slices:

  - slice: Create group
    type: State Change
    screen:
      name: New group
      fields:
        groupName: string
        currency: string
        memberName: string
      wireframe:
        - "< Home        New group"
        - "Group name        [........]"
        - "Currency          [ DKK   v ]"
        - "Your name in it   [........]"
        - ""
        - "        [ Create group ]"
    command:
      name: CreateGroup
      fields:
        groupName: { type: string, feeds: [GroupCreated.name] }
        currency: string
        memberName: { type: string, feeds: [MemberAdded.displayName] }
        createdBy:                                         # the signed-in user
          type: UserId
          source: system
          feeds: [MemberAdded.by, MemberClaimed.userId]
        # new id, chosen when the form is shown and carried in it, so a resubmitted
        # form names the group it already created instead of making a second one
        groupId: { type: GroupId, source: system }
        memberId: { type: MemberId, source: system }       # new id; feeds both events by name
    events:
      # three events from one command: a group whose creator is not a member is
      # a meaningless state, so the creator is seated and claimed here
      - name: GroupCreated
        fields:
          groupId: GroupId
          name: string
          currency: string
          createdBy: UserId
      - name: MemberAdded
        fields:
          memberId: MemberId
          displayName: string
          by: UserId
      - name: MemberClaimed
        fields:
          memberId: MemberId
          userId: UserId

  - slice: Add a member
    type: State Change
    screen:
      name: Add member
      fields:
        groupId: GroupId
        displayName: string
        email: string                                      # optional: given, the new member is invited at once
      wireframe:
        - "< Lisbon trip     Add member"
        - "In this group"
        - "  Alice (you)"
        - "  Bob      Invited"
        - "Name              [........]"
        - "Email (optional)  [........]"
        - ""
        - "        [ Add member ]"
    command:
      name: AddMember
      fields:
        displayName: string
        email: string                                      # none: a placeholder, invitable later (InviteMember)
        by: { type: UserId, source: system }               # the signed-in user
        # new id, chosen when the form is shown and carried in it, so a resubmitted
        # form names the member it already added instead of adding a second
        memberId: { type: MemberId, source: system }
        inviteId: { type: InviteId, source: system }       # new id; names the Invite document
        # the clock; the invite's deadline is decided now and recorded: now + 30 days
        now: { type: DateTimeOffset, source: system, feeds: [MemberInvited.expiresAt] }
        # guards for the invite, as InviteMember's (spec §11): may be stale; the claim
        # enforces one user, one slot
        emailHolder: { type: "UserId?", source: lookup }     # Identity: account with this email
        invitedTo: { type: "MemberId[]", source: lookup }    # Invite: slots invited at it
    events:
      # one command, two events: adding with an email is adding and inviting, and a
      # rejected invite adds no one - the form is corrected and sent again
      - MemberAdded
      - name: MemberInvited
        fields:
          memberId: MemberId
          inviteId: InviteId
          expiresAt: DateTimeOffset
          by: UserId

  - slice: Invite a member
    type: State Change
    screen:
      name: Invite member
      fields:
        groupId: GroupId
        memberId: MemberId
        email: string
    command:
      name: InviteMember
      fields:
        memberId: MemberId
        # no email in the ledger: it goes to the erasable Invite document, and the email
        email: string
        # names the Invite document that binds this slot to the address
        inviteId: { type: InviteId, source: system }       # new id
        # the clock; the invite's deadline is decided now and recorded: now + 30 days
        now: { type: DateTimeOffset, source: system, feeds: [MemberInvited.expiresAt] }
        by: { type: UserId, source: system }               # the signed-in user
        # guards (spec §11): may be stale; the claim enforces one user, one slot
        emailHolder: { type: "UserId?", source: lookup }     # Identity: account with this email
        invitedTo: { type: "MemberId[]", source: lookup }    # Invite: slots invited at it
    events: [MemberInvited]

  - slice: View homepage
    type: State Read
    screen:
      name: Home
      fields:
        invites: "PendingInvite[]"
        groups: "GroupSummary[]"
      wireframe:
        - "Alice invited you to"
        - "Lisbon trip as Bob  [Join]"
        - ""
        - "Your groups"
        - "  Lisbon trip"
        - "  Porto"
        - "[New group]"
    readModel:
      # two parts, each kept the way its data needs (spec §11):
      # groups - a stored, asynchronous projection (UserGroups), keyed by user and
      #   folded across every group's events: the list cannot be computed per request
      # invites - live: each invited group's stream is folded per request. An invite
      #   shows only while it is its slot's current one, unclaimed and unexpired, in
      #   a group the user is not already in.
      name: HomepageReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user
        # Invite documents addressed to the user's (verified) account email
        invitedAs: { type: "InviteId[]", source: lookup }
        now: { type: DateTimeOffset, source: system }      # live while now < expiresAt
        # each with its group id, which "Join" sends; soonest deadline first
        invites: { type: "PendingInvite[]", source: [GroupCreated, MemberAdded, MemberInvited, MemberClaimed] }
        # the groups the user holds a slot in, by name
        groups: { type: "GroupSummary[]", source: [GroupCreated, MemberClaimed] }
      reads:
        - GroupCreated
        - MemberAdded
        - MemberInvited
        - MemberClaimed

  - slice: Accept invite
    type: State Change
    screen: Home
    command:
      name: AcceptInvite
      fields:
        now: { type: DateTimeOffset, source: system }      # the clock: now < expiresAt
        userId: { type: UserId, source: system }           # the signed-in user, claiming
        # Invite documents in this group addressed to the user's account email: they
        # propose; the stream decides which, if any, is a slot's current open invite
        invitedAs: { type: "InviteId[]", source: lookup }
        # the slot whose current, unexpired invite is one of those - found by deciding
        memberId: { type: MemberId, source: stream }
    events: [MemberClaimed]

  - slice: Record an expense
    type: State Change
    screen:
      name: Add expense
      fields:
        groupId: GroupId
        description: string
        amountMinor: long                                  # typed in the currency's units ("120.50"); the endpoint converts
        payerMemberId: MemberId
        # one of: equal (participants) | shares (a share each) | exact (an amount each)
        # the first screen offers equal only; the form already carries its mode
        split: ExpenseSplit
        paidOn: DateOnly
      wireframe:
        - "< Lisbon trip     Add expense"
        - "What for          [ Dinner   ]"
        - "Amount (GBP £)    [ 120.00   ]"
        - "Paid by           [ Alice v  ]"
        - "Shared equally between"
        - "  [x] Alice  [x] Bob  [ ] Carol"
        - "Date              [ 2 Oct    ]"
        - ""
        - "         [ Add expense ]"
    command:
      name: RecordExpense
      fields:
        # new id, chosen when the form is shown and carried in it, so a resubmitted
        # form names the expense it already recorded instead of recording a second
        expenseId: { type: ExpenseId, source: system }
        description: string
        amountMinor: long
        payerMemberId: MemberId
        split: ExpenseSplit                                # the inputs, as entered
        paidOn: DateOnly
        now: { type: DateTimeOffset, source: system }      # the clock: paidOn is not in the future
        by: { type: UserId, source: system }               # the signed-in user
        # the per-person amounts, computed by deciding (spec §6): the rounding's
        # leftovers go payer first, then in member-added order - read from the stream
        splits: { type: "Split[]", source: stream }
    events:
      - name: ExpenseRecorded
        fields:
          expenseId: ExpenseId
          description: string
          amountMinor: long
          payerMemberId: MemberId
          split: ExpenseSplit
          splits: "Split[]"
          paidOn: DateOnly
          by: UserId

  - slice: View group
    type: State Read
    screen:
      name: Group
      fields:
        groupId: GroupId
        groupName: string
        currency: string
        you: MemberId                                      # what you paid sits on the left
        balance: long                                      # your standing, beside Settle up
        history: "ActivityEntry[]"
      wireframe:
        - "< Home       Lisbon trip"
        - "You owe £70.00 [Settle up]"
        - "Dinner £90.00"
        - "  You paid"
        - "             Taxi £140.00"
        - "                Bob paid"
        - "[Add expense]  [Balances]"
    readModel:
      # stored, inline: projected in the transaction that appends the events, so an
      # expense appears, and your standing moves, the moment it is saved (spec §11)
      name: GroupActivityReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user: members only
        groupId: { type: GroupId, source: [GroupCreated] }
        groupName: { type: string, source: [GroupCreated] }
        currency: { type: string, source: [GroupCreated] }
        you: { type: MemberId, source: [MemberClaimed] }   # the caller's own slot
        # the caller's balance (spec §9)
        balance: { type: long, source: [ExpenseRecorded, SettlementRecorded] }
        # the money: expenses and settlements in one list, each marked by kind and
        # named, newest first; an expense with its split as entered and its amounts
        history: { type: "ActivityEntry[]", source: [MemberAdded, ExpenseRecorded, SettlementRecorded] }
      reads:
        - GroupCreated
        - MemberAdded
        - MemberClaimed
        - ExpenseRecorded
        - SettlementRecorded   # emitted in Record settlement: drawn dashed

  - slice: View balances
    type: State Read
    screen:
      name: Balances
      fields:
        groupId: GroupId
        groupName: string
        currency: string
        you: MemberId
        members: "MemberBalance[]"
      wireframe:
        - "< Lisbon trip   Balances"
        - "Alice (you)  is owed £60.00"
        - "Bob                owes £30.00"
        - "Carol (invited)  owes £30.00"
        - ""
        - "              [Settle up]"
    readModel:
      # live: the group stream folded per request, nothing stored (spec §11).
      # Balances follow spec §9 and always sum to zero.
      name: GroupBalancesReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user: members only
        now: { type: DateTimeOffset, source: system }      # an invite is open until its deadline
        groupId: { type: GroupId, source: [GroupCreated] }
        groupName: { type: string, source: [GroupCreated] }
        currency: { type: string, source: [GroupCreated] }
        you: { type: MemberId, source: [MemberClaimed] }   # the caller's own slot
        # each slot with its name, status (joined, invited, placeholder) and balance
        members: { type: "MemberBalance[]", source: [MemberAdded, MemberInvited, MemberClaimed, ExpenseRecorded, SettlementRecorded] }
      reads:
        - GroupCreated
        - MemberAdded
        - MemberInvited
        - MemberClaimed
        - ExpenseRecorded
        - SettlementRecorded   # emitted in Record settlement: drawn dashed

  - slice: Record settlement
    type: State Change
    screen:
      name: Settle up
      fields:
        groupId: GroupId
        fromMemberId: MemberId                             # who paid
        toMemberId: MemberId                               # who received
        amountMinor: long                                  # in the group currency's minor unit
        paidOn: DateOnly
      wireframe:
        - "Bob pays Alice  30.00 [Paid]"
        - ""
        - "or record any payment:"
        - "[ Bob v ] -> [ Alice v ]"
        - "[ 30.00 ]  on [ 2 Oct ]"
        - "             [ Record ]"
    command:
      name: RecordSettlement
      fields:
        settlementId: { type: SettlementId, source: system } # new id
        fromMemberId: MemberId
        toMemberId: MemberId
        amountMinor: long
        paidOn: DateOnly
        now: { type: DateTimeOffset, source: system }      # the clock: paidOn is not in the future
        by: { type: UserId, source: system }               # the signed-in user: any member
    events:
      - name: SettlementRecorded
        fields:
          settlementId: SettlementId
          fromMemberId: MemberId
          toMemberId: MemberId
          amountMinor: long
          paidOn: DateOnly
          by: UserId

  - slice: View settlement plan
    type: State Read
    screen: Settle up
    readModel:
      # computed per request from a live fold of the group stream; never stored and
      # never an event (spec §10, §11). A pure function of the balances, with shared
      # history only breaking ties.
      name: SettlementPlanReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user: members only
        currency: { type: string, source: [GroupCreated] }
        you: { type: MemberId, source: [MemberClaimed] }   # the caller's own slot
        # who pays whom, with names, ordered by payer then recipient (member-added)
        transfers: { type: "Transfer[]", source: [MemberAdded, ExpenseRecorded, SettlementRecorded] }
      reads:
        - GroupCreated
        - MemberAdded
        - MemberClaimed
        - ExpenseRecorded
        - SettlementRecorded
