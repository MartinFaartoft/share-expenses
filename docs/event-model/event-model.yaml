# Event model for the shared expenses app - the source of truth.
#
# Render and validate with:
#     .venv/bin/python docs/event-model/generate.py
#
# The .d2 file is generated from this file, named after the chapter; never edit it
# by hand.  Card dimensions and the field-padding width are the generator's
# concern, not the model's: the padding width is computed from the longest line
# in the model.
# Given-when-then specifications live in slice-NN-*.md.
#
# STRUCTURE
#   Every slice owns the elements it introduces.  An element is DECLARED once,
#   in mapping form with a `name`, at its first appearance in slice order; every
#   later appearance is a bare string reference.  So fields are written exactly
#   once, and a misspelled reference is an undeclared name rather than a silent
#   new element.
#
# SLICE TYPES - the four canonical Event Modeling types:
#   State Change  a user action that changes system state, enforcing the business
#                 rules, and recording what happened as events
#   State Read    a screen, report or API response projected from stored events
#   Automation    reacts to a state without human intervention, issuing further
#                 commands or side effects
#   Translation   an integration point where the outside world pushes data in,
#                 mapping foreign data into this domain's language
#   Automation and Translation are recognised but not yet rendered: the happy path
#   needs neither, and their layout is best designed against a real slice.
#
# ARROWS - none are written.
#   Intra-slice arrows are implied by `type`:
#     State Change : screen -> command -> each event, in listed order
#     State Read   : each event in `reads` -> read model -> screen
#   Inter-slice arrows exist only where a read model consumes events emitted in
#   other slices, declared as its `reads` list of event type names.  The
#   generator resolves each name to the nearest occurrence at or before this
#   slice, and draws it dashed when the only occurrence is later.
#
# FIELDS - shape, and where every value comes from (information completeness).
#   A field is `name: Type`, or a mapping when it needs more than a type.
#   Shapes are declared once, like every element.  Sources sit on the field:
#     screen      `inputs:`  - what the user types or picks
#                 `context:` - what the screen already holds: the group being
#                              viewed, the slot or invite tapped
#     command     `source:` by trust -
#                   client  sent by the caller: typed, or held by the screen (default)
#                   system  supplied by the server: signed-in user, clock, new ids
#                   stream  derived by deciding, from the folded stream
#                   lookup  read from outside the stream, e.g. Identity; stale-able,
#                           so it never feeds an event field: it may feed guards, or
#                           propose candidates that deciding confirms against the stream
#                 `feeds:`  [Event.field, ...] - event fields it fills that are
#                           NOT already same-named (same name feeds implicitly)
#     event       a type only.  Where an event's values come from depends on the
#                 slice emitting it, so that lives on that slice's command.
#     read model  `source:` [Event, ...] - the events the field is built from
#     query       on a State Read slice: `query:` {input: {type, source}},
#                 source client, system or lookup
#   The generator checks BACKWARD only - every value used is available from a
#   step before it: every event field is fed by exactly one command field of the
#   same type; every client value is an input or context of its screen; every
#   read model field is built from events the read model reads.  Whether a value
#   is used afterwards is not checked.
#   How a client value travels (route, body, link fragment) is transport, not
#   model: it is recorded in the slice's .md and enforced in code.
#   `draft: true` marks a slice not yet refined: it skips these checks and is
#   labelled "(draft)" on the diagram.  Remove the flag as part of refining.

chapter: Happy path

slices:

  - slice: Create group
    type: State Change
    screen:
      name: New group
      inputs:
        groupName: string
        currency: string
        memberName: string
      wireframe:
        - "name       [........]"
        - "currency   [ GBP  v ]"
        - "your name  [........]"
        - ""
        - "  [ Create group ]"
    command:
      name: CreateGroup
      fields:
        groupName: { type: string, feeds: [GroupCreated.name] }
        currency: string
        memberName: { type: string, feeds: [MemberAdded.displayName] }
        createdBy:                                         # the signed-in user
          type: UserId
          source: system
          feeds: [MemberAdded.by, MemberClaimed.userId]
        groupId: { type: GroupId, source: system }         # new id
        memberId: { type: MemberId, source: system }       # new id; feeds both events by name
    events:
      # three events from one command: a group whose creator is not a member is
      # a meaningless state, so the creator is seated and claimed here
      - name: GroupCreated
        fields:
          groupId: GroupId
          name: string
          currency: string
          createdBy: UserId
      - name: MemberAdded
        fields:
          memberId: MemberId
          displayName: string
          by: UserId
      - name: MemberClaimed
        fields:
          memberId: MemberId
          userId: UserId

  - slice: Add a member
    type: State Change
    screen:
      name: Group setup
      context:
        groupId: GroupId
      inputs:
        displayName: string
    command:
      name: AddMember
      fields:
        displayName: string
        by: { type: UserId, source: system }               # the signed-in user
        memberId: { type: MemberId, source: system }       # new id
    events:  [MemberAdded]
        
  - slice: Invite a member
    type: State Change
    screen:
      name: Invite member
      context:
        groupId: GroupId
        memberId: MemberId
      inputs:
        email: string
    command:
      name: InviteMember
      fields:
        memberId: MemberId
        # no email in the ledger: it goes to the erasable Invite document, and the email
        email: string
        # names the Invite document that binds this slot to the address
        inviteId: { type: InviteId, source: system }       # new id
        # the clock; the invite's deadline is decided now and recorded: now + 30 days
        now: { type: DateTimeOffset, source: system, feeds: [MemberInvited.expiresAt] }
        by: { type: UserId, source: system }               # the signed-in user
        # guards (spec §11): may be stale; the claim enforces one user, one slot
        emailHolder: { type: "UserId?", source: lookup }     # Identity: account with this email
        invitedTo: { type: "MemberId[]", source: lookup }    # Invite: slots invited at it
    events:
      - name: MemberInvited
        fields:
          memberId: MemberId
          inviteId: InviteId
          expiresAt: DateTimeOffset
          by: UserId

  - slice: View invites
    type: State Read
    screen:
      name: Your invites
      context:
        groupId: GroupId                                   # the invite tapped
      wireframe:
        - "Alice invited you to"
        - "Lisbon trip as Bob"
        - "            [ Join ]"
    query:
      userId: { type: UserId, source: system }             # the signed-in user
      # Invite documents addressed to the user's (verified) account email
      invites: { type: "InviteId[]", source: lookup }
      now: { type: DateTimeOffset, source: system }        # live while now < expiresAt
    readModel:
      # live: each invited group's stream is folded per request. An invite shows
      # only while it is its slot's current one, unclaimed and unexpired, in a
      # group the user is not already in.
      name: PendingInvitesReadModel
      fields:
        invites: { type: "PendingInvite[]", source: [GroupCreated, MemberAdded, MemberInvited, MemberClaimed] }
      reads:
        - GroupCreated
        - MemberAdded
        - MemberInvited
        - MemberClaimed

  - slice: Accept invite
    type: State Change
    screen: Your invites
    command:
      name: AcceptInvite
      fields:
        now: { type: DateTimeOffset, source: system }      # the clock: now < expiresAt
        userId: { type: UserId, source: system }           # the signed-in user, claiming
        # Invite documents in this group addressed to the user's account email: they
        # propose; the stream decides which, if any, is a slot's current open invite
        invitedAs: { type: "InviteId[]", source: lookup }
        # the slot whose current, unexpired invite is one of those - found by deciding
        memberId: { type: MemberId, source: stream }
    events: [MemberClaimed]

  - slice: Record an expense
    type: State Change
    screen:
      name: Add expense
      context:
        groupId: GroupId
      inputs:
        description: string
        amountMinor: long                                  # in the group currency's minor unit
        payerMemberId: MemberId
        # one of: equal (participants) | shares (a share each) | exact (an amount each)
        split: ExpenseSplit
        paidOn: DateOnly
      wireframe:
        - "Dinner          [ 120.00 ]"
        - "paid by         [ Alice v ]"
        - "split  (equal) exact shares"
        - "[x] Alice [x] Bob [ ] Carol"
        - "on              [ 2 Oct ]"
        - "             [ Add ]"
    command:
      name: RecordExpense
      fields:
        expenseId: { type: ExpenseId, source: system }     # new id
        description: string
        amountMinor: long
        payerMemberId: MemberId
        split: ExpenseSplit                                # the inputs, as entered
        paidOn: DateOnly
        now: { type: DateTimeOffset, source: system }      # the clock: paidOn is not in the future
        by: { type: UserId, source: system }               # the signed-in user
        # the per-person amounts, computed by deciding (spec §6): the rounding's
        # leftovers go payer first, then in member-added order - read from the stream
        splits: { type: "Split[]", source: stream }
    events:
      - name: ExpenseRecorded
        fields:
          expenseId: ExpenseId
          description: string
          amountMinor: long
          payerMemberId: MemberId
          split: ExpenseSplit
          splits: "Split[]"
          paidOn: DateOnly
          by: UserId

  - slice: View balances
    draft: true
    type: State Read
    screen:
      name: Balances
    readModel:
      name: GroupLedger
      fields:
        members: "Member[]"
        expenses: "Expense[]"
        balances: long
      reads:
        - GroupCreated
        - MemberAdded
        - MemberInvited
        - MemberClaimed
        - ExpenseRecorded
        - SettlementRecorded   # emitted in Settle up: drawn dashed

  - slice: Settle up
    draft: true
    type: State Change
    screen:
      name: Settle up
    command:
      name: RecordSettlement
    events:
      - name: SettlementRecorded
