name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: MartinFaartoft/codex-actions/.github/workflows/deploy-site.yml@v1
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
