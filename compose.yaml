# Local development database. Production runs PostgreSQL directly on the VPS (spec §3).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: splitit
      POSTGRES_USER: splitit
      POSTGRES_PASSWORD: splitit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitit -d splitit"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
